server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # File con l'impronta nel nome: si possono tenere in cache per un anno.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Questi devono essere sempre aggiornati.
  location ~ ^/(index\.html|sw\.js|config\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
